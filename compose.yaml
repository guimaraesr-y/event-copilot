name: event-command-center

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecc-local}
      POSTGRES_DB: ${POSTGRES_DB:-ecc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecc} -d ${POSTGRES_DB:-ecc}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      target: runtime
    command: ["sh", "-lc", "bun run db:migrate && bun run start:api"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://ecc:ecc-local@postgres:5432/ecc}
      API_PORT: ${API_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DOMAIN_EVENT_SHARED_SECRET: ${DOMAIN_EVENT_SHARED_SECRET:-development-domain-event-secret-change-me-32chars}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-mock}
      MESSAGING_WEBHOOK_SHARED_SECRET: ${MESSAGING_WEBHOOK_SHARED_SECRET:-development-messaging-webhook-secret-change-me-32chars}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      META_GRAPH_API_VERSION: ${META_GRAPH_API_VERSION:-}
      META_GRAPH_API_BASE_URL: ${META_GRAPH_API_BASE_URL:-https://graph.facebook.com}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 8s

  worker:
    build:
      context: .
      target: runtime
    command: ["bun", "run", "start:worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://ecc:ecc-local@postgres:5432/ecc}
      OUTBOX_TRANSPORT: ${OUTBOX_TRANSPORT:-n8n}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-2000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      N8N_DOMAIN_EVENTS_URL: ${N8N_DOMAIN_EVENTS_URL:-http://n8n:5678/webhook/ecc-domain-events}
      DOMAIN_EVENT_SHARED_SECRET: ${DOMAIN_EVENT_SHARED_SECRET:-development-domain-event-secret-change-me-32chars}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2.34.0
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-ecc}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-ecc-local}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-development-only-change-me-32-chars}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:8080/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/files/n8n:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  gateway:
    image: caddy:2.10-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      n8n:
        condition: service_healthy

volumes:
  postgres-data:
  n8n-data:
